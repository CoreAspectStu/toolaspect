
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: utility-sites
          directory: ./ # This points to the root of your repository
          # optional: branch: ${{ github.ref_name }} # Defaults to production branch
          gitHubToken: ${{ secrets.GITHUB_TOKEN }} # Needed for GitHub Pages integration
          wranglerVersion: '3' # Specify Wrangler v3

