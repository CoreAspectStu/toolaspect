<style>
.page-container{max-width:680px;margin:0 auto;padding:2rem 1.5rem;position:relative;z-index:1}
.page-header{text-align:center;margin-bottom:2rem}
.page-header h1{font-size:1.65rem;font-weight:700;margin-bottom:6px}

.card{margin-bottom:1rem}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-md);padding:.65rem .9rem;font-size:.9rem;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.10);outline:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-calc{width:100%;padding:.7rem 1.2rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:.95rem;font-weight:600;cursor:pointer;transition:all var(--transition);margin-top:8px}
.btn-calc:hover{background:var(--primary-light);transform:translateY(-1px)}
.result-box{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.2rem;margin-top:1rem;display:none}
.result-box.show{display:block}
.result-box .label{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.result-box .value{font-size:2rem;font-weight:700;color:var(--primary)}
.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);align-items:center}
.result-row:last-child{border-bottom:none}
.output-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem;margin-top:1rem;font-family:var(--font-mono);font-size:.85rem;white-space:pre-wrap;word-break:break-all;display:none;max-height:400px;overflow-y:auto}
.output-area.show{display:block}
.output-area.show{display:block;padding:1.5rem}

.content-section p{font-size:.9rem;color:var(--text-secondary);line-height:1.7;margin-bottom:.75rem}

<body>
<div class="page-container">
<div class="page-header">
<h1>Word Search Maker</h1>
<p class="subtitle">Create custom word search puzzles instantly.</p>
</div>
<div class="ad-slot" data-position="top"></div>
<div class="card">
<div class="form-group">
<label>Your Words (comma separated, max 20)</label>
<textarea id="words" rows="3" style="font-family:var(--font-sans);resize:vertical" placeholder="APPLE, BANANA, CHERRY, GRAPE, LEMON">APPLE, BANANA, CHERRY, GRAPE, LEMON</textarea>
</div>
<div class="form-row">
<div class="form-group"><label>Grid Size</label><select id="gridSize"><option value="10">10x10</option><option value="12" selected>12x12</option><option value="15">15x15</option><option value="20">20x20</option></select></div>
<div class="form-group"><label>Diagonal Words</label><select id="diagonal"><option value="1">Yes</option><option value="0">No</option></select></div>
</div>
<button class="btn-calc" onclick="generatePuzzle()">Generate Puzzle</button>
</div>
<div class="output-area" id="puzzleArea" style="text-align:center;font-family:var(--font-mono)"></div>
<div class="ad-slot" data-position="middle"></div>
<div class="content-section">
<h2>About the Word Search Maker</h2>
<p>Create custom word search puzzles instantly. Enter your words and generate a printable puzzle. Free word search generator.</p>
</div>
<div class="related-links"><a href="/finance-calculator/">Finance Calculator</a><a href="/percentage-calculator/">Percentage Calculator</a><a href="/unit-converter/">Unit Converter</a></div>
</div>
<script src="/shared/ads.js"></script>
<script>
function generatePuzzle(){
var words=document.getElementById("words").value.split(",").map(function(w){return w.trim().toUpperCase();}).filter(function(w){return w.length>0&&w.length<=20;});
var size=parseInt(document.getElementById("gridSize").value);
var allowDiag=document.getElementById("diagonal").value==="1";
var grid=[];for(var r=0;r<size;r++){grid[r]=[];for(var c=0;c<size;c++)grid[r][c]=String.fromCharCode(65+Math.floor(Math.random()*26));}
var dirs=[[0,1],[1,0]];if(allowDiag){dirs.push([1,1]);dirs.push([1,-1]);}
words.forEach(function(word){
for(var attempt=0;attempt<50;attempt++){
var dir=dirs[Math.floor(Math.random()*dirs.length)];
var row=Math.floor(Math.random()*size);var col=Math.floor(Math.random()*size);
if(row+dir[0]*word.length>size||col+dir[1]*word.length>size||col+dir[1]*word.length<0)continue;
var ok=true;
for(var i=0;i<word.length;i++){var r=row+dir[0]*i;var c=col+dir[1]*i;if(grid[r][c]!==word[i]&&grid[r][c]!==String.fromCharCode(65+Math.floor(Math.random()*26)))ok=false;}
if(ok){for(var i=0;i<word.length;i++){grid[row+dir[0]*i][col+dir[1]*i]=word[i];}break;}
}});
var html="<div style=\'display:inline-block;text-align:left\'>";
for(var r=0;r<size;r++){var line="";for(var c=0;c<size;c++){line+=grid[r][c]+" ";}html+="<div style=\'letter-spacing:2px;margin:2px 0\'>"+line+"</div>";}
html+="</div><div style=\'margin-top:1rem;text-align:left;font-size:.85rem\'><b>Find:</b> "+words.join(", ")+"</div>";
document.getElementById("puzzleArea").innerHTML=html;
document.getElementById("puzzleArea").classList.add("show");
}
</script>
</body>
