<head>

<style>
.page-container{max-width:600px;margin:0 auto;padding:2rem 1.5rem;position:relative;z-index:1}
.page-header{text-align:center;margin-bottom:2rem}
.page-header h1{font-size:1.65rem;font-weight:700;margin-bottom:6px}
.page-header .subtitle{color:var(--muted);font-size:.92rem}
.timer-display{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center;margin-bottom:1.5rem}
.timer-display .time{font-size:3.5rem;font-weight:700;font-family:var(--font-mono);color:var(--primary);letter-spacing:2px}
.timer-display .ms{font-size:1.5rem;color:var(--text-secondary)}
.controls{display:flex;gap:.75rem;justify-content:center;margin-bottom:1.5rem}
.btn-sw{padding:.7rem 2rem;border:none;border-radius:var(--radius-md);font-size:1rem;font-weight:600;cursor:pointer;transition:all var(--transition)}
.btn-start{background:var(--success);color:#fff}.btn-start:hover{filter:brightness(1.1)}
.btn-stop{background:var(--danger);color:#fff}.btn-stop:hover{filter:brightness(1.1)}
.btn-lap{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-lap:hover{border-color:var(--primary)}
.btn-reset{background:var(--surface);color:var(--text-secondary);border:1px solid var(--border)}.btn-reset:hover{border-color:var(--danger);color:var(--danger)}
.laps{max-height:300px;overflow-y:auto}
.lap-row{display:flex;justify-content:space-between;padding:.6rem 1rem;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:.85rem}
.lap-row:first-child{color:var(--primary);font-weight:600}
.content-section{margin-top:2rem;padding:1.5rem 0}
.content-section h2{font-size:1.15rem;font-weight:600;margin-bottom:.5rem}
.content-section p{font-size:.9rem;color:var(--text-secondary);line-height:1.7}
.related-links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem}
.related-links a{padding:.4rem .8rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:.82rem;color:var(--text-secondary)}
.related-links a:hover{border-color:var(--primary);color:var(--text)}
</style>
</head>
<body>
<div class="page-container">
<div class="page-header">
<h1>Stopwatch</h1>
<p class="subtitle">Millisecond-precision stopwatch with lap tracking.</p>
</div>
<div class="ad-slot" data-position="top"></div>
<div class="timer-display">
<span class="time" id="display">00:00:00</span><span class="ms" id="msDisplay">.000</span>
</div>
<div class="controls">
<button class="btn-sw btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
<button class="btn-sw btn-lap" id="lapBtn" onclick="recordLap()" disabled>Lap</button>
<button class="btn-sw btn-reset" onclick="resetTimer()">Reset</button>
</div>
<div class="laps" id="laps"></div>
<div class="ad-slot" data-position="middle"></div>
<div class="content-section">
<h2>About the Stopwatch</h2>
<p>Free online stopwatch with millisecond precision and lap timing. No installation needed — works entirely in your browser.</p>
</div>
<div class="related-links">
<a href="/countdown-timer/">Countdown Timer</a>
<a href="/pomodoro-timer/">Pomodoro Timer</a>
</div>
</div>
<script src="/shared/ads.js"></script>
<script>
var startTime,elapsed=0,timerInt=null,running=false,lastLap=0;
function toggleTimer(){
if(running){clearInterval(timerInt);running=false;document.getElementById('startBtn').textContent='Resume';document.getElementById('startBtn').className='btn-sw btn-start';document.getElementById('lapBtn').disabled=true;}
else{startTime=Date.now()-elapsed;timerInt=setInterval(update,10);running=true;document.getElementById('startBtn').textContent='Stop';document.getElementById('startBtn').className='btn-sw btn-stop';document.getElementById('lapBtn').disabled=false;}
}
function update(){
elapsed=Date.now()-startTime;
var totalMs=elapsed;
var h=Math.floor(totalMs/3600000);totalMs-=h*3600000;
var m=Math.floor(totalMs/60000);totalMs-=m*60000;
var s=Math.floor(totalMs/1000);var ms=totalMs%1000;
document.getElementById('display').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
document.getElementById('msDisplay').textContent='.'+(ms<100?(ms<10?'00':'0'):'')+ms;
}
function recordLap(){
var lapTime=elapsed-lastLap;lastLap=elapsed;
var totalMs=lapTime;
var m=Math.floor(totalMs/60000);totalMs-=m*60000;
var s=Math.floor(totalMs/1000);var ms=totalMs%1000;
var lapStr=(m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+(ms<100?(ms<10?'00':'0'):'')+ms;
var lapNum=document.getElementById('laps').children.length+1;
var div=document.createElement('div');div.className='lap-row';
div.innerHTML='<span>Lap '+lapNum+'</span><span>'+lapStr+'</span>';
document.getElementById('laps').prepend(div);
}
function resetTimer(){clearInterval(timerInt);running=false;elapsed=0;lastLap=0;document.getElementById('display').textContent='00:00:00';document.getElementById('msDisplay').textContent='.000';document.getElementById('startBtn').textContent='Start';document.getElementById('startBtn').className='btn-sw btn-start';document.getElementById('lapBtn').disabled=true;document.getElementById('laps').innerHTML='';}
</script>
</body>
</html>
